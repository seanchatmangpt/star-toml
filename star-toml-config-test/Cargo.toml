[package]
name = "star-toml-config-test"
version = "26.6.29"
edition = "2021"
rust-version = "1.82"
authors = ["Sean Chatman <sean@chatmangpt.com>"]
license = "MIT"
description = "Runtime config conformance test helpers for star-toml"
repository = "https://github.com/seanchatmangpt/star-toml"
homepage = "https://github.com/seanchatmangpt/star-toml"
keywords = ["testing", "config", "toml", "conformance", "validation"]
categories = ["development-tools::testing", "config"]

[dependencies]
star-toml = { path = "..", version = "26.6.29" }
star-toml-json-schema = { path = "../star-toml-json-schema", version = "26.6.29" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
