[package]
name = "star-toml-derive"
version = "26.6.29"
edition = "2021"
rust-version = "1.82"
authors = ["Sean Chatman <sean@chatmangpt.com>"]
license = "MIT"
description = "Procedural macro derive crate for star-toml validation"
repository = "https://github.com/seanchatmangpt/star-toml"
homepage = "https://github.com/seanchatmangpt/star-toml"
keywords = ["derive", "proc-macro", "validation", "toml", "config"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
