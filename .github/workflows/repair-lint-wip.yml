name: Materialize verifier lint repair

on:
  push:
    branches:
      - dependabot/cargo/minor-and-patch-5753cf405a
    paths:
      - '.github/workflows/repair-lint-wip.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly-2026-04-15
        with:
          components: rustfmt, clippy
      - name: Apply typed verifier repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/bin/verifier_report.rs')
          s = p.read_text()
          s = s.replace(
              'fn make_temp_dir() -> PathBuf {\n    let base = std::env::temp_dir().join(format!("star-toml-verif-{}", std::process::id()));\n    fs::create_dir_all(&base).expect("create temp dir");\n    base\n}',
              'fn make_temp_dir() -> Option<PathBuf> {\n    let base = std::env::temp_dir().join(format!("star-toml-verif-{}", std::process::id()));\n    fs::create_dir_all(&base).ok()?;\n    Some(base)\n}'
          )
          s = s.replace(
              'fn write_toml(dir: &Path, name: &str, content: &str) -> PathBuf {\n    let path = dir.join(name);\n    fs::write(&path, content).expect("write_toml");\n    path\n}',
              'fn write_toml(dir: &Path, name: &str, content: &str) -> Option<PathBuf> {\n    let path = dir.join(name);\n    fs::write(&path, content).ok()?;\n    Some(path)\n}'
          )
          s = s.replace(
              'let passed: bool = (|| -> bool { $body })();',
              'let passed: bool = (|| -> Option<bool> { Some($body) })().unwrap_or(false);'
          )
          s = s.replace('let dir = make_temp_dir();', 'let dir = make_temp_dir()?;')
          s = re.sub(r'(?m)^(\s*)write_toml\((.*)\);$', r'\1write_toml(\2)?;', s)
          s = s.replace('.unwrap_err();', '.err()?;')
          s = s.replace('.unwrap();', '.ok()?;')
          s = s.replace(
              '    fs::write("VERIFIER_REPORT.md", &report).expect("write VERIFIER_REPORT.md");',
              '    if let Err(err) = fs::write("VERIFIER_REPORT.md", &report) {\n        eprintln!("failed to write VERIFIER_REPORT.md: {err}");\n        std::process::exit(2);\n    }'
          )
          p.write_text(s)

          q = Path('examples/dfcm_common_patterns.rs')
          t = q.read_text()
          t = t.replace('format!("workers[{}]", i)', 'format!("workers[{i}]")')
          t = t.replace('println!("Admission failed: {:?}", e);', 'println!("Admission failed: {e:?}");')
          q.write_text(t)
          PY
          cargo fmt --all
          git diff --check
      - name: Verify full clippy court
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Publish repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-lint-wip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(lint): make verifier failures non-panicking'
          git push origin HEAD:${{ github.ref_name }}
